name: 'ctx_earned_hours_shadow'
version: '1.0.0'
config-version: 2
profile: 'ctx_earned_hours_shadow'

model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ctx_earned_hours_shadow:
    staging:
      +materialized: incremental
      +incremental_strategy: merge
      +schema: BRONZE
    intermediate:
      +materialized: dynamic_table
      +schema: SILVER
    marts:
      +materialized: dynamic_table
      +schema: GOLD
    reconciliation:
      +materialized: view
      +schema: PUBLIC
